[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remarkable2zotero"
version = "0.1.0"
description = "Extract reMarkable tablet annotations and import into Zotero"
requires-python = ">=3.10"
dependencies = [
    "rmscene>=0.8.0",
    "pymupdf>=1.24.0",
    "paramiko>=3.0",
    "pyzotero>=1.5.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.4.0",
]

[project.scripts]
remarkable2zotero = "remarkable2zotero.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100
